{% extends "base.html" %}
{% load static %}
{% block title %}QR · {{ venue.name }}{% endblock %}
{% block body_class %}print-page{% endblock %}
{% block content %}
<section class="card center qr-card">
  <img class="qr-logo" src="{% static 'img/logo-cronso.webp' %}" alt="Cronso" width="501" height="640">
  <p class="eyebrow">{{ venue.name }}</p>
  <h1>¿Quieres escuchar tu canción?</h1>
  <p class="lead">Escanea y pídesela al DJ</p>
  <img class="qr-img" src="{% url 'venues:qr_svg' venue.slug %}" alt="Código QR para {{ venue.name }}" width="320" height="320">
  <p class="muted qr-url">{{ venue.public_url }}</p>
  <button class="btn btn-primary no-print" onclick="window.print()">{% icon "printer" %} Imprimir</button>
</section>
{% endblock %}
