{% extends "base.html" %}
{% load static %}
{% block title %}QR · {{ event.name }}{% endblock %}
{% block body_class %}print-page{% endblock %}
{% block content %}
<section class="card center qr-card">
  <img class="qr-logo" src="{% static 'img/logo-cronso.webp' %}" alt="Cronso" width="501" height="640">
  <p class="eyebrow">{{ event.venue.name }}</p>
  <h1>{{ event.name }}</h1>
  <p class="lead">Escanea y pídele tu canción al DJ</p>
  <img class="qr-img" src="{% url 'events:qr' event.code %}" alt="Código QR del evento" width="320" height="320">
  <p class="muted qr-url">{{ event.public_url }}</p>
  <button class="btn btn-primary no-print" onclick="window.print()">🖨️ Imprimir</button>
</section>
{% endblock %}
